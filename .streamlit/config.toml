[theme]
base = "light"
primaryColor = "#6d28d9"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f3ff"
textColor = "#1f1b2e"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
# Streamlit ya protege contra XSRF por defecto; se deja explícito.
enableXsrfProtection = true
enableCORS = true
